<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dont Be Late Tee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script src="js/order.js" defer></script> <!-- link to JS file-->
  </head>
  <body class="d-flex flex-column min-vh-100">

    <!--PRODUCT PAGE 2 DONT BE LATE TEE -->
    <header class="bg-2 py-12 text-center">
      <div class="container">
        <h1 class="text-2xl fw-light mt-4 mb-8">Gab & Co.</h1>
      </div>
    </header>

    <main class="container bg-1 py-12">
      <div class="container text-start">
      <div class="row align-items-center">

      <!-- PRODUCT PAGE 2: Column 1 -->
      <div class="col">
        <img src="image1.png" class="img-fluid my-auto" alt="Don't Be Late Tee">
      </div>

      <!-- PRODUCT PAGE 2: Column 2 -->
      <div class="col">
        <h1 id="product-name" class="text-4xl fw-bold mb-5">Don't Be Late Tee</h1> <!-- added id for javascript-->
        <h2 id="product-price" class="text-3l fw-light mb-4">From Php 499.00</h2> <!-- added id for javascript-->
        <p class="text-1l fw-light mb-8">A simple reminder to show up, get moving, and make the most of the day.</p>
      <div>
        <form id="order-form"> <!--converted to form to submit-->
          <h4 class="text-2l fw-medium mb-40">Size</h4>
          <div class="hstack gap-3 justify-content-start">
            <label><input type="radio" name="size" value="XS" required> XS</label><!-- changed these to radio input types for multiple choices -->
            <label><input type="radio" name="size" value="S"> S</label>
            <label><input type="radio" name="size" value="M"> M</label>
            <label><input type="radio" name="size" value="L"> L</label>
            <label><input type="radio" name="size" value="XL"> XL</label>
          </div>

          <h4 class="text-2l fw-medium mt-10 mb-20">Quantity</h4>
          <input type="number" id="quantity" class="form-control text-center" value="1" min="1" max="100" aria-label="Quantity" style="width: 140px;">

          <div class="hstack justify-content-center">
            <button type="submit" id="order-now" class="btn-solid theme-primary btn-lg rounded-9 w-100 mt-10 mb-20">Order now</button>
          </div>
          <p id="order-status" role="status"></p>
        </form>
      </div> <!-- closes column 2 -->
      </div> <!-- closes row -->
      </div> <!-- closes container -->
    </div>
    </main>
  </body>
</html>
