
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"
    <title>Product Page 1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="main-header">
    <h1>Gab & Co.</h1>
  </header>
<div class="container">
    <div class="product">
      <div class="gallery">
        <img src="image1.png" alt="Don't be late Tee">
      </div>
      <div class="details">
        <p1>Gab & Co.</p1>
        <h1>Do Good Work Tee</h1>
        <h2>From Php 499.00</h2>
        <p>A Simple Statement for people who believe good work speaks for itself.</p>
        <form>
          <p2>Size</p2>
          <div class="size-select">
            <label for="extra small">
              <input type="radio" name="size" id="extra small">
              <span>XS</span>
            </label>
            <label for="small">
              <input type="radio" name="size" id="small">
              <span>S</span>
            </label>
            <label for="medium">
              <input type="radio" name="size" id="medium">
              <span>M</span>
            </label>
            <label for="large">
              <input type="radio" name="size" id="large">
              <span>L</span>
            </label>
            <label for="extra large">
              <input type="radio" name="size" id="extra large">
              <span>XL</span>
            </label>
          </div>
          <div class="quantity-select">
            <p1>Quantity</p1>
          </div>
            <div class="quantity-select">
              <button type="button" class="minus" aria-label="Decreases">-</button>
              <input type="number" class="quantity-input" value="1" min="0" max="100" readonly>
              <button type="button" class="add" aria-label="Increases">+</button>
            </div>
            <button>Buy It Now</button>
        </form>
    </div>
</div>
</body>
  </body>
</html>
</body>
  </body>
</html>
