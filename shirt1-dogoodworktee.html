<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Do Good Work Tee</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body class="d-flex flex-column min-vh-100">

    <!--PRODUCT PAGE 1 DO GOOD WORK TEE -->
    <header class="bg-2 py-12 text-center">
      <div class="container">
        <h1 class="text-2xl fw-light mt-4 mb-8">Gab & Co.</h1>
      </div>
    </header>

    <main class="container bg-1 py-12">
      <div class="container text-start">
      <div class="row align-items-center">

      <!-- PRODUCT PAGE 1: Column 1 -->
      <div class="col">
        <img src="image1.png" class="img-fluid my-auto" alt="Do Good Work Tee">
      </div>

      <!-- PRODUCT PAGE 1: Column 2 -->
      <div class="col">
        <h1 class="text-4xl fw-bold mb-5">Do Good Work Tee</h1>
        <h2 class="text-3l fw-light mb-4">From Php 499.00</h2>
        <p class="text-1l fw-light mb-8">A Simple Statement for people who believe good work speaks for itself.</p>
          <h4 class="text-2l fw-medium mb-40">Size</h4>
          <div class="hstack gap-3 justify-content-start">
            <a class="btn-solid theme-secondary btn-s rounded-9 w-5">XS</a>
            <a class="btn-solid theme-secondary btn-s rounded-9 w-5">S</a>
            <a class="btn-solid theme-secondary btn-s rounded-9 w-5">M</a>
            <a class="btn-solid theme-secondary btn-s rounded-9 w-5">L</a>
            <a class="btn-solid theme-secondary btn-s rounded-9 w-5">XL</a>
          </div>
      <div>
        <h4 class="text-2l fw-medium mt-10 mb-20">Quantity</h4>
        <div class="input-group" style="width: 140px;">
          <button class="btn btn-outline theme-secondary minus" type="button" aria-label="Decreases quantity">-</button>
          <input type="number" class="form-control text-center quantity-input" value="1" min="0" max="100" readonly aria-label="Quantity">
          <button class="btn btn-outline theme-secondary minus" type="button" aria-label="Increases quantity">+</button> 
        </div>
      </div>
      <div class="hstack justify-content-center">
        <a href="#Cart" class="btn-solid theme-primary btn-lg rounded-9 w-100 mt-10 mb-20">Buy Now!</a>
      </div>
    </main>
  </body>
</html>
