<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us</title>
<link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
<header class="bg-2 py-12 text-center">
   <div class="container">
     <h1 class="text-5xl fw-bold mb-5">Contact Us</h1>
     <p class="text-lg fg-2 mb-9">
       From product support to general inquiries, we’ve got you covered.
     </p>
     <div class="hstack gap-2 justify-content-center">
       <a href="#about" class="btn-solid theme-primary btn-lg">Get started</a>
     </div>
   </div>
 </header>
 <main class="container py-12">
 <div class="row g-7" id="about">
   <div>
     <h2>Contact us</h2>
     <form id="contact-form" class="contact-form" action="#" method="post">
      <div class="mb-3">
        <label for="full-name" class="form-label">Full name <span class="required">(required)</span></label>
        <input type="text" id="full-name" name="full-name" class="form-control" required autocomplete="name" aria-describedby="yourFullName">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email address <span class="required">(required)</span></label>
        <input type="email" class="form-control" name="email" id="email" aria-describedby="yourEmailAddress" autocomplete="email">
      </div>
      <div class="mb-3">
        <label for="topic" class="form-label">Topic <span class="required">(required)</span></label>
          <select id="topic" name="topic" class="form-control"  aria-describedby="chooseTopic" required>
            <option value="">Choose a topic</option>
            <option value="order">A question about an order</option>
            <option value="product">A question about a product</option>
            <option value="other">Something else</option>
          </select>  
      </div>
      <div>
        <div class="form-field">
          <label for="message" class="form-label">Message <span class="required">(required)</span></label>
          <textarea class="form-control" id="message" name="message" rows="3" aria-describedby="message-contact-us"></textarea>
          <div class="form-text">
            Please do not include passwords or payment details.
          </div>
        </div>
      </div>
      </form>
  <button type="submit" class="btn-solid theme-primary">Submit</button>
 </main>
 </body>
</html>
